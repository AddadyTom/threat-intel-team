version: '3.8'

services:
  threat-intel-agent:
    build: .
    container_name: threat_intel_agent
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - POLL_INTERVAL=900
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
